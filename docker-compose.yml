services:
  research-inbox:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/inbox.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400
