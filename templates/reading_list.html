<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading List — Research Inbox</title>
<style>
  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --border: #e5e3dd;
    --border-strong: #ccc9c0;
    --text: #1a1a18;
    --text-2: #6b6a65;
    --text-3: #9e9c97;
    --accent: #1a6fd4;
    --accent-bg: #eef4fd;
    --accent-border: #b8d0f0;
    --success: #1a7a4a;
    --success-bg: #eaf5ef;
    --warning: #916a00;
    --warning-bg: #fef9ec;
    --danger: #b83232;
    --danger-bg: #fdf0f0;
    --radius: 8px;
    --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151513;
      --surface: #1e1e1b;
      --border: #2e2e2a;
      --border-strong: #3e3e3a;
      --text: #e8e6e0;
      --text-2: #9e9c97;
      --text-3: #6b6a65;
      --accent: #5b9fee;
      --accent-bg: #1a2a3e;
      --accent-border: #2a4a6e;
      --success: #4aaa74;
      --success-bg: #162a20;
      --warning: #d4a020;
      --warning-bg: #2a2210;
      --danger: #e06060;
      --danger-bg: #2a1616;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }
  .container { max-width: 1000px; margin: 0 auto; padding: 2rem 1.25rem; }
  header { margin-bottom: 1.5rem; }
  header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  header p { font-size: 14px; color: var(--text-2); margin-top: 4px; }

  .top-nav { display: flex; gap: 16px; margin-bottom: 1.5rem; }
  .top-nav a { font-size: 14px; font-weight: 500; color: var(--text-2); text-decoration: none; padding-bottom: 4px; border-bottom: 2px solid transparent; }
  .top-nav a:hover { color: var(--text); }
  .top-nav a.active { color: var(--accent); border-bottom-color: var(--accent); }

  .capture {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
  }
  .capture label { font-size: 13px; color: var(--text-2); display: block; margin-bottom: 6px; }
  .capture input {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    margin-bottom: 10px;
  }
  .capture input:focus { outline: none; border-color: var(--accent); }
  .capture input::placeholder { color: var(--text-3); }
  .capture-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .err-msg { font-size: 13px; color: var(--danger); flex: 1; }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  button:hover { background: var(--bg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { opacity: 0.9; }
  button.sm { font-size: 13px; padding: 4px 10px; }
  button:disabled { opacity: 0.6; cursor: default; }

  /* Layout: sidebar + main pane */
  .layout { display: flex; gap: 28px; align-items: flex-start; }
  .sidebar { width: 210px; flex-shrink: 0; }
  .main-pane { flex: 1; min-width: 0; }
  @media (max-width: 700px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; }
  }

  .sidebar details { margin-bottom: 16px; }
  .sidebar summary {
    cursor: pointer; font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; user-select: none;
  }
  .sidebar-item {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font-size: 14px; padding: 5px 8px; border-radius: var(--radius); cursor: pointer;
    color: var(--text-2);
  }
  .sidebar-item span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sidebar-item:hover { background: var(--bg); }
  .sidebar-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 500; }
  .sidebar-item .count { color: var(--text-3); font-size: 12px; flex-shrink: 0; }
  .sidebar-item.active .count { color: var(--accent); }

  .list-heading { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 10px; }
  .entries { display: flex; flex-direction: column; gap: 8px; }
  .entry {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .row-header {
    padding: 0.55rem 1rem;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }
  .row-header:hover { background: var(--bg); }
  .row-chevron { flex-shrink: 0; font-size: 13px; color: var(--text-3); transition: transform 0.15s; font-style: normal; }
  .collapsed .row-chevron { transform: rotate(-90deg); }
  .collapsed .entry-body { display: none; }
  .row-title { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-folder-tag {
    font-size: 11px; color: var(--text-3); background: var(--bg); border: 1px solid var(--border);
    border-radius: 20px; padding: 1px 8px; flex-shrink: 0; white-space: nowrap;
  }
  .entry-body { border-top: 1px solid var(--border); padding: 1rem 1.25rem; }
  .paper-title {
    display: block;
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    line-height: 1.4;
    margin-bottom: 3px;
  }
  .paper-title:hover { text-decoration: underline; }
  .paper-authors { font-size: 12px; color: var(--text-3); margin-bottom: 12px; }
  .why-box {
    background: var(--bg);
    border-left: 2px solid var(--accent);
    border-radius: 0 var(--radius) var(--radius) 0;
    padding: 10px 14px;
    font-size: 14px;
    color: var(--text-2);
    line-height: 1.6;
    margin-bottom: 12px;
  }
  .why-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; font-weight: 600; }
  .thoughts-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; font-weight: 600; display: block; }
  .thoughts-box {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    resize: vertical;
    margin-bottom: 10px;
  }
  .thoughts-box:focus { outline: none; border-color: var(--accent); }
  .card-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn-icon {
    background: none; border: none; color: var(--text-3); padding: 4px; border-radius: var(--radius); cursor: pointer; font-size: 16px; line-height: 1; display: flex; align-items: center; margin-left: auto;
  }
  .btn-icon:hover { color: var(--danger); background: var(--danger-bg); }
  .empty { text-align: center; padding: 1.5rem 0; color: var(--text-3); font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  {% include "_nav.html" %}
  <header>
    <h1>Reading list</h1>
    <p>Papers you've decided to actually read.</p>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <details open>
        <summary>To read</summary>
        <div id="sidebar-to_read"></div>
      </details>
      <details open>
        <summary>Read</summary>
        <div id="sidebar-read"></div>
      </details>
      <details>
        <summary>Not interested</summary>
        <div id="sidebar-not_interested"></div>
      </details>
    </aside>

    <main class="main-pane">
      <div class="capture">
        <label for="link-input">Arxiv link or id</label>
        <input id="link-input" type="text" placeholder="e.g. https://arxiv.org/abs/1706.03762">
        <label for="folder-input">Folder (optional)</label>
        <input id="folder-input" type="text" list="folder-datalist" placeholder="e.g. ML Theory">
        <datalist id="folder-datalist"></datalist>
        <label for="reason-input">Why do you want to read this? (optional)</label>
        <input id="reason-input" type="text" placeholder="e.g. came up in a talk on attention mechanisms">
        <div class="capture-row">
          <button class="primary" onclick="addPaper()">Add</button>
          <span class="err-msg" id="add-err"></span>
        </div>
      </div>

      <div class="list-heading" id="list-heading"></div>
      <div class="entries" id="paper-list"></div>
    </main>
  </div>
</div>

<script>
let items = [];
let expandedIds = new Set();
let activeFilter = {status: 'to_read', folder: null};

async function loadList() {
  try {
    const r = await fetch('/api/reading-list');
    items = await r.json();
    render();
  } catch(e) { console.error(e); }
}

async function addPaper() {
  const link = document.getElementById('link-input');
  const folder = document.getElementById('folder-input');
  const reason = document.getElementById('reason-input');
  const err = document.getElementById('add-err');
  err.textContent = '';
  const linkVal = link.value.trim();
  if (!linkVal) { err.textContent = 'Paste an arxiv link first.'; return; }
  try {
    const r = await fetch('/api/reading-list', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({arxiv_link: linkVal, folder: folder.value.trim(), reason: reason.value.trim()})
    });
    const data = await r.json();
    if (!r.ok) { err.textContent = data.error || 'Failed to add.'; return; }
    link.value = ''; folder.value = ''; reason.value = '';
    await loadList();
  } catch(e) {
    err.textContent = 'Failed to save. Is the server running?';
  }
}

async function setStatus(id, status, e) {
  e.stopPropagation();
  await fetch('/api/reading-list/' + id, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({status})
  });
  loadList();
}

async function saveFolder(id, value) {
  await fetch('/api/reading-list/' + id, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({folder: value.trim() || null})
  });
  loadList();
}

async function saveThoughts(id, value) {
  await fetch('/api/reading-list/' + id, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({thoughts: value})
  });
}

async function removeItem(id, e) {
  e.stopPropagation();
  if (!confirm('Remove this paper from your reading list?')) return;
  await fetch('/api/reading-list/' + id, {method: 'DELETE'});
  loadList();
}

function folderOptions() {
  const folders = [...new Set(items.map(i => i.folder).filter(Boolean))].sort();
  return folders.map(f => `<option value="${esc(f)}">`).join('');
}

function toggleExpand(id) {
  if (expandedIds.has(id)) expandedIds.delete(id);
  else expandedIds.add(id);
  render();
}

function setFilterFromDataset(el) {
  const status = el.dataset.status;
  const folder = el.dataset.isAll === '1' ? null : el.dataset.folder;
  activeFilter = {status, folder};
  render();
}

function sidebarItem(status, folderKey, label, count) {
  const isAll = folderKey === null;
  const isActive = activeFilter.status === status && activeFilter.folder === folderKey;
  return `<div class="sidebar-item${isActive ? ' active' : ''}"
      data-status="${status}" data-folder="${esc(folderKey || '')}" data-is-all="${isAll ? '1' : '0'}"
      onclick="setFilterFromDataset(this)">
    <span>${esc(label)}</span><span class="count">${count}</span>
  </div>`;
}

function folderGroupedSidebarHTML(status, statusItems) {
  const groups = Object.create(null);
  statusItems.forEach(i => {
    const key = i.folder || '';
    (groups[key] = groups[key] || []).push(i);
  });
  const folderNames = Object.keys(groups).filter(k => k !== '').sort();

  let html = sidebarItem(status, null, 'All', statusItems.length);
  if (groups['']) html += sidebarItem(status, '', 'Uncategorized', groups[''].length);
  folderNames.forEach(f => { html += sidebarItem(status, f, f, groups[f].length); });
  return html;
}

function renderSidebar() {
  const toRead = items.filter(i => i.status === 'to_read');
  const read = items.filter(i => i.status === 'read');
  const notInterested = items.filter(i => i.status === 'not_interested');

  document.getElementById('sidebar-to_read').innerHTML = folderGroupedSidebarHTML('to_read', toRead);
  document.getElementById('sidebar-read').innerHTML = folderGroupedSidebarHTML('read', read);
  document.getElementById('sidebar-not_interested').innerHTML = sidebarItem('not_interested', null, 'All', notInterested.length);
}

function currentFilterLabel() {
  const statusLabel = {to_read: 'To read', read: 'Read', not_interested: 'Not interested'}[activeFilter.status];
  if (activeFilter.folder === null) return statusLabel;
  if (activeFilter.folder === '') return `${statusLabel} — Uncategorized`;
  return `${statusLabel} — ${activeFilter.folder}`;
}

function matchesFilter(item) {
  if (item.status !== activeFilter.status) return false;
  if (activeFilter.folder === null) return true;
  return (item.folder || '') === activeFilter.folder;
}

function paperRow(item) {
  const expanded = expandedIds.has(item.id);
  const url = `https://arxiv.org/abs/${item.arxiv_id}`;
  const showStatusButtons = item.status === 'to_read';

  const detailHTML = `
    <div class="entry-body">
      <a class="paper-title" href="${url}" target="_blank" rel="noopener">${esc(item.title)}</a>
      <div class="paper-authors">${esc(item.authors || '')}${item.venue ? ' · ' + esc(item.venue) : ''}</div>
      ${item.reason ? `<div class="why-box"><div class="why-label">Why</div>${esc(item.reason)}</div>` : ''}
      <label class="thoughts-label" for="folder-${item.id}">Folder</label>
      <input class="thoughts-box" id="folder-${item.id}" type="text" list="folder-datalist"
        value="${esc(item.folder || '')}" placeholder="Uncategorized"
        onblur="saveFolder(${item.id}, this.value)" onclick="event.stopPropagation()">
      <label class="thoughts-label" for="thoughts-${item.id}">Thoughts</label>
      <textarea class="thoughts-box" id="thoughts-${item.id}" rows="2"
        onblur="saveThoughts(${item.id}, this.value)" onclick="event.stopPropagation()">${esc(item.thoughts || '')}</textarea>
      <div class="card-actions">
        ${showStatusButtons ? `
          <button class="sm" onclick="setStatus(${item.id}, 'read', event)">Finished reading</button>
          <button class="sm" onclick="setStatus(${item.id}, 'not_interested', event)">Not interested</button>
        ` : ''}
        <button class="btn-icon" onclick="removeItem(${item.id}, event)" title="Remove" aria-label="Remove">✕</button>
      </div>
    </div>
  `;

  return `
    <div class="entry${expanded ? '' : ' collapsed'}">
      <div class="row-header" onclick="toggleExpand(${item.id})">
        <span class="row-chevron">▾</span>
        <span class="row-title">${esc(item.title)}</span>
        <span class="row-folder-tag">${esc(item.folder || 'Uncategorized')}</span>
      </div>
      ${expanded ? detailHTML : ''}
    </div>
  `;
}

function render() {
  document.getElementById('folder-datalist').innerHTML = folderOptions();
  renderSidebar();

  document.getElementById('list-heading').textContent = currentFilterLabel();

  const matching = items.filter(matchesFilter);
  document.getElementById('paper-list').innerHTML =
    matching.map(paperRow).join('') || '<div class="empty">Nothing here.</div>';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadList();
</script>
</body>
</html>
